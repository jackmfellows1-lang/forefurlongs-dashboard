<!DOCTYPE html>
<html>
<head>
    <title>ForeFurlongs Dashboard</title>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .score {
            color: #22c55e;
            font-size: 32px;
            font-weight: bold;
        }

        .title {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .badge {
            background: #22c55e;
            color: black;
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🔥 ForeFurlongs Dashboard</h1>

    <div class="card">
        <div class="title">Trojan Soldier</div>

        <div class="score">65.2</div>

        <p>Pontefract 7:52</p>

        <div class="badge">ELITE CONSENSUS</div>

        <p>DEI: A+</p>

        <p>Field Rank: 1/12</p>
    </div>

</body>
</html>
